# Classification model candidates for experiment search.
# Each entry defines a model family, its sklearn-compatible class, default constructor
# kwargs, and the hyperparameter grid to sweep.
#
# Fields:
#   family:      display name shown in MLflow and the leaderboard
#   class:       fully-qualified Python class (importlib-resolved)
#   defaults:    kwargs passed to the constructor for every grid point
#   param_grid:  dict of {param: [values]} — expanded with ParameterGrid (exhaustive)

candidates:
  - family: XGBoost
    class: xgboost.XGBClassifier
    defaults:
      verbosity: 0
      random_state: 42
      eval_metric: mlogloss
    param_grid:
      n_estimators: [100, 200]
      max_depth: [4, 6]
      learning_rate: [0.05, 0.10]

  - family: LightGBM
    class: lightgbm.LGBMClassifier
    defaults:
      verbosity: -1
      random_state: 42
    param_grid:
      n_estimators: [100, 200]
      max_depth: [6, 8]
      learning_rate: [0.05, 0.08]

  - family: RandomForest
    class: sklearn.ensemble.RandomForestClassifier
    defaults:
      random_state: 42
      n_jobs: -1
    param_grid:
      n_estimators: [100, 200, 300]
      max_depth: [null, 10, 20]

  - family: SVM
    class: sklearn.svm.SVC
    defaults:
      probability: false
      random_state: 42
    param_grid:
      C: [0.1, 1.0, 10.0]
      kernel: [rbf, linear]

  - family: LogisticRegression
    class: sklearn.linear_model.LogisticRegression
    defaults:
      max_iter: 2000
      random_state: 42
    param_grid:
      C: [0.1, 1.0, 10.0]
      solver: [lbfgs, saga]
